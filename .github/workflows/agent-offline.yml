name: XCMate EPG Agent - offline validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'xcmate_epg/**'
      - 'tests/**'
      - '.github/workflows/agent-offline.yml'
permissions:
  contents: read
concurrency:
  group: epg-offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # ONLY synthetic state: PRs may read repository Actions caches.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/xcmate-synthetic-state
          key: synthetic-v1-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            synthetic-v1-${{ github.ref_name }}-
      - name: Unit and mocked transport tests, no network or secrets
        run: python -m unittest discover -s tests -v
      - name: Existing bootstrap smoke
        run: python tools/smoke_xmltv.py --output "$RUNNER_TEMP/bootstrap-smoke"
      - name: Synthetic incremental CLI and restart
        run: |
          python -m xcmate_epg --state "$RUNNER_TEMP/xcmate-synthetic-state/state.sqlite" --output "$RUNNER_TEMP/epg-demo"
          cp "$RUNNER_TEMP/epg-demo/manifest.json" "$RUNNER_TEMP/before.json"
          python -m xcmate_epg --state "$RUNNER_TEMP/xcmate-synthetic-state/state.sqlite" --output "$RUNNER_TEMP/epg-demo"
          cmp "$RUNNER_TEMP/before.json" "$RUNNER_TEMP/epg-demo/manifest.json"
