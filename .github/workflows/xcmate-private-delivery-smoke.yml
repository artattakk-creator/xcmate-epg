name: XCMate private delivery – manual synthetic smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xcmate-private-delivery-smoke
  cancel-in-progress: false

jobs:
  private-output-smoke:
    name: Private GitHub publisher and independent synthetic readback
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify REST privacy, publish and read back a synthetic fixture
        env:
          XCMATE_EPG_PRIVATE_WRITE_TOKEN: ${{ secrets.XCMATE_EPG_PRIVATE_WRITE_TOKEN }}
          XCMATE_EPG_PRIVATE_READ_TOKEN: ${{ secrets.XCMATE_EPG_PRIVATE_READ_TOKEN }}
        run: python3 -m xcmate_epg.github_smoke
